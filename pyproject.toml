[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-archiver"
version = "0.1.0"
description = "Archive exported AI chats as tidy local Markdown - one file per conversation, with a searchable index page. Local-first; nothing is ever uploaded."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["chat", "archive", "ollama", "markdown", "local-first", "chatgpt", "open-webui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.scripts]
chat-archiver = "chat_archiver.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
